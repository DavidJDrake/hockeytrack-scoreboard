name: Image

# Builds the scoreboard SD card image and the update payloads. A tag builds
# pi-gen's image, lays out the six-partition A/B card from it, gates the
# result, attests the flash image and both payloads in a separate job that
# runs no build code, then waits for approval of the image-release
# environment before the manifest is signed in KMS and anything is published.
# A manual run builds and gates only. See
# docs/superpowers/specs/2026-09-12-device-image-design.md, section 9, and
# docs/superpowers/specs/2026-09-25-ota-update-design.md, sections 4.4 and 6.
#
# Channels: a vX.Y.Z tag publishes to the stable channel (latest.json); a
# vX.Y.Z-test tag publishes the same version to the test channel
# (latest-test.json), which only a panel whose STATE carries a channel file
# saying test reads. A test release is approved in the same environment by
# the same person, is just as real and just as signed, and its manifest
# expires six hours after publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and gate
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # Read-only on purpose. pi-gen runs a --privileged container for about two
    # hours, executing apt maintainer scripts, a floating Docker base image and
    # third-party code; a privileged container can read the runner's
    # ACTIONS_ID_TOKEN_REQUEST_* variables. With no id-token or attestations
    # permission here, there is no token for it to steal: the attest job signs.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
      boot_sha256: ${{ steps.checksum.outputs.boot_sha256 }}
      root_sha256: ${{ steps.checksum.outputs.root_sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          # A workflow_dispatch run against a tag ref sets ref_type=tag and
          # ref_name=<tag>, same as a real tag push, so the event is checked
          # too. Only a push of the tag may publish. The channel comes from
          # the tag: vX.Y.Z is stable, vX.Y.Z-test is test with the same
          # version; the rule that only an administrator may create v* tags
          # covers both.
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=$REF_NAME" >>"$GITHUB_OUTPUT"
            echo "tag=$REF_NAME" >>"$GITHUB_OUTPUT"
            echo "channel=stable" >>"$GITHUB_OUTPUT"
            echo "publish=true" >>"$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-test$ ]]; then
            echo "version=${REF_NAME%-test}" >>"$GITHUB_OUTPUT"
            echo "tag=$REF_NAME" >>"$GITHUB_OUTPUT"
            echo "channel=test" >>"$GITHUB_OUTPUT"
            echo "publish=true" >>"$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev.$RUN" >>"$GITHUB_OUTPUT"
            echo "tag=" >>"$GITHUB_OUTPUT"
            echo "channel=none" >>"$GITHUB_OUTPUT"
            echo "publish=false" >>"$GITHUB_OUTPUT"
          fi

      # pi-gen needs about 20 GB; the runner image ships toolchains this build
      # never uses. Fail here rather than two hours into the build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          free_gb="$(df --output=avail -BG / | tail -n 1 | tr -dc 0-9)"
          echo "free: ${free_gb} GB"
          [ "$free_gb" -ge 25 ] || { echo "need 25 GB free, have ${free_gb} GB" >&2; exit 1; }

      - name: Build the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/pi-gen/build.sh "$VERSION" "$RUNNER_TEMP/pi-gen"

      # tools/image-layout.sh writes the FAT partitions with mtools and the
      # ext4 ones with mkfs.ext4 -d, never mounting anything; the runner has
      # util-linux, e2fsprogs and xz but not these two.
      - name: Install the layout tools
        run: sudo apt-get install -y --no-install-recommends dosfstools mtools

      - name: Lay out the A/B card
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          img="$(ls "$RUNNER_TEMP"/pi-gen/deploy/*-scoreboard.img.xz)"
          xz -dc "$img" >"$RUNNER_TEMP/pi-gen.img"
          mkdir -p "$RUNNER_TEMP/pigen-rootfs" "$RUNNER_TEMP/pigen-bootfs"
          loop="$(sudo losetup --find --show --partscan --read-only "$RUNNER_TEMP/pi-gen.img")"
          cleanup() {
            sudo umount "$RUNNER_TEMP/pigen-rootfs" "$RUNNER_TEMP/pigen-bootfs" 2>/dev/null || true
            sudo losetup -d "$loop" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo udevadm settle
          sudo mount -o ro,noload "${loop}p2" "$RUNNER_TEMP/pigen-rootfs"
          sudo mount -o ro "${loop}p1" "$RUNNER_TEMP/pigen-bootfs"
          # As root, because pi-gen's root has files only root may read and
          # mkfs.ext4 -d has to read all of them to copy their ownership.
          sudo tools/image-layout.sh "$RUNNER_TEMP/pigen-rootfs" "$RUNNER_TEMP/pigen-bootfs" "$VERSION" "$RUNNER_TEMP/layout"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/layout"
          cleanup
          rm "$RUNNER_TEMP/pi-gen.img" "$RUNNER_TEMP"/pi-gen/deploy/*-scoreboard.img.xz

      - name: Gate the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/layout/scoreboard-$VERSION.img"
          mkdir -p "$RUNNER_TEMP/rootfs" "$RUNNER_TEMP/bootfs"
          loop="$(sudo losetup --find --show --partscan --read-only "$image")"
          # Belt and suspenders: if the gate (or anything after it) fails,
          # still unmount and detach the loop device instead of leaking it
          # into the next step or the runner teardown.
          cleanup() {
            sudo umount "$RUNNER_TEMP/rootfs" "$RUNNER_TEMP/bootfs" 2>/dev/null || true
            sudo losetup -d "$loop" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo udevadm settle
          # Slot A: partition 5 is ROOT-A, partition 2 is BOOT-A. noload: a
          # read-only mount of an ext4 that wants journal recovery would
          # otherwise refuse to mount (or replay the journal). The assembled
          # image is passed too, for the partition table, slot B, SETUP and
          # STATE, which the gate reads without mounting.
          sudo mount -o ro,noload "${loop}p5" "$RUNNER_TEMP/rootfs"
          sudo mount -o ro "${loop}p2" "$RUNNER_TEMP/bootfs"
          sudo tools/image-gate.sh "$RUNNER_TEMP/rootfs" "$RUNNER_TEMP/bootfs" "$GITHUB_WORKSPACE" --image "$image"

      # The update payloads must be byte-identical to what a flashed panel's
      # slot A holds, because a panel updated from them and a panel flashed
      # from the image must be the same panel. The manifest's raw hashes come
      # from this comparison, not from a second build.
      - name: Check slot A equals the payloads
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/layout"
          image="scoreboard-$VERSION.img"
          slot_sha() {
            sfdisk --dump "$image" | awk -v n="$1" '
              / : start=/ { i++; if (i == n) { match($0, /start= *[0-9]+/); s = substr($0, RSTART, RLENGTH); sub(/.*= */, "", s);
                                              match($0, /size= *[0-9]+/); z = substr($0, RSTART, RLENGTH); sub(/.*= */, "", z); print s * 512, z * 512 } }' \
              | { read -r start size; dd if="$image" bs=1M iflag=skip_bytes,count_bytes skip="$start" count="$size" status=none | sha256sum | cut -d' ' -f1; }
          }
          boot_raw="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["boot"]["rawSha256"])' "scoreboard-$VERSION.payloads.json")"
          root_raw="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["root"]["rawSha256"])' "scoreboard-$VERSION.payloads.json")"
          [ "$(slot_sha 2)" = "$boot_raw" ] || { echo "BOOT-A in the image is not the boot payload" >&2; exit 1; }
          [ "$(slot_sha 5)" = "$root_raw" ] || { echo "ROOT-A in the image is not the root payload" >&2; exit 1; }
          echo "slot A is the payloads: boot $boot_raw, root $root_raw"

      - name: Name and checksum
        id: checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          # The flash image compresses to about 700 MB: the empty space is
          # zeros. The raw slot images are not shipped; their hashes are in
          # payloads.json and were just checked against the image.
          xz -T0 "$RUNNER_TEMP/layout/scoreboard-$VERSION.img"
          mv "$RUNNER_TEMP/layout/scoreboard-$VERSION.img.xz" \
             "$RUNNER_TEMP/layout/scoreboard-$VERSION.boot.img.xz" \
             "$RUNNER_TEMP/layout/scoreboard-$VERSION.root.img.xz" \
             "$RUNNER_TEMP/layout/scoreboard-$VERSION.payloads.json" out/
          (cd out && for f in "scoreboard-$VERSION.img.xz" "scoreboard-$VERSION.boot.img.xz" "scoreboard-$VERSION.root.img.xz"; do
            sha256sum "$f" >"$f.sha256"; cat "$f.sha256"; done)
          echo "sha256=$(cut -d' ' -f1 "out/scoreboard-$VERSION.img.xz.sha256")" >>"$GITHUB_OUTPUT"
          echo "boot_sha256=$(cut -d' ' -f1 "out/scoreboard-$VERSION.boot.img.xz.sha256")" >>"$GITHUB_OUTPUT"
          echo "root_sha256=$(cut -d' ' -f1 "out/scoreboard-$VERSION.root.img.xz.sha256")" >>"$GITHUB_OUTPUT"
          # The publish job checks out nothing, so what it needs from the
          # repository travels in the artifact: the manifest tool, and the
          # release-signing PUBLIC keys it checks KMS's signature against. A
          # swapped key in the repository therefore fails the release rather
          # than the fleet.
          cp tools/release-manifest.py out/
          cp -r device/certs/release-signing out/release-signing

      - name: Keep the image for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: out/
          if-no-files-found: error
          # An image-release approval can wait up to 30 days.
          retention-days: 30
          compression-level: 0

  attest:
    name: Attest build provenance
    needs: build
    # Only an image that will be offered for publishing is attested, and only
    # here: this job checks out nothing and runs no build code, so the token
    # that can mint an attestation under this workflow's identity never shares
    # a runner with pi-gen.
    if: needs.build.outputs.publish == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
      EXPECTED_BOOT_SHA256: ${{ needs.build.outputs.boot_sha256 }}
      EXPECTED_ROOT_SHA256: ${{ needs.build.outputs.root_sha256 }}
    steps:
      - name: Fetch the gated image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: out

      - name: Check it is the image the build job gated
        run: |
          set -euo pipefail
          # The build job's outputs travel outside the artifact, so a swapped
          # artifact (files and .sha256 together) cannot pass this. All three
          # files are checked: the payloads are what a panel installs.
          check() {
            actual="$(sha256sum "out/$1" | cut -d' ' -f1)"
            [ "$actual" = "$2" ] || {
              echo "downloaded $1 sha256 ($actual) does not match what the build job gated ($2)" >&2
              exit 1
            }
          }
          check "scoreboard-$VERSION.img.xz" "$EXPECTED_SHA256"
          check "scoreboard-$VERSION.boot.img.xz" "$EXPECTED_BOOT_SHA256"
          check "scoreboard-$VERSION.root.img.xz" "$EXPECTED_ROOT_SHA256"

      # The flash image AND both payloads, so `gh attestation verify` covers
      # what a panel installs, not only what a person flashes.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/scoreboard-${{ needs.build.outputs.version }}.img.xz
            out/scoreboard-${{ needs.build.outputs.version }}.boot.img.xz
            out/scoreboard-${{ needs.build.outputs.version }}.root.img.xz

  publish:
    name: Publish
    needs: [build, attest]
    # A workflow_dispatch run against a tag ref sets outputs.publish=true
    # from the build job too; require the triggering event to have been an
    # actual tag push, not just a build that looks like one.
    if: needs.build.outputs.publish == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: image-release
    # Repo-wide, not per-ref, so two publish runs can never interleave
    # their S3/CloudFront writes. This alone does not decide which
    # version should win when releases are approved out of order — the
    # "Mirror to the image CDN" step below handles that by comparing
    # versions before it ever overwrites latest.json. A group holds one
    # running and one pending job, so a third publish queuing cancels the
    # pending one: that run ends cancelled, never half-published, and can be
    # re-run while its artifact lives (30 days).
    concurrency:
      group: image-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      CHANNEL: ${{ needs.build.outputs.channel }}
      EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
      EXPECTED_BOOT_SHA256: ${{ needs.build.outputs.boot_sha256 }}
      EXPECTED_ROOT_SHA256: ${{ needs.build.outputs.root_sha256 }}
    steps:
      - name: Fetch the gated image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: out

      - name: Re-check the checksum
        run: |
          set -euo pipefail
          cd out
          for f in "scoreboard-$VERSION.img.xz" "scoreboard-$VERSION.boot.img.xz" "scoreboard-$VERSION.root.img.xz"; do
            sha256sum -c "$f.sha256"
          done
          # The .sha256 files travelled in the same artifact as the images, so
          # matching them only proves the set wasn't corrupted in transit.
          # Compare against the values the build job emitted as job outputs,
          # which are independent of the artifact bundle.
          check() {
            actual="$(sha256sum "$1" | cut -d' ' -f1)"
            [ "$actual" = "$2" ] || {
              echo "downloaded $1 sha256 ($actual) does not match what the build job attested ($2)" >&2
              exit 1
            }
          }
          check "scoreboard-$VERSION.img.xz" "$EXPECTED_SHA256"
          check "scoreboard-$VERSION.boot.img.xz" "$EXPECTED_BOOT_SHA256"
          check "scoreboard-$VERSION.root.img.xz" "$EXPECTED_ROOT_SHA256"
          # payloads.json is what the manifest is built from; it must
          # describe these files and no others.
          python3 - "$VERSION" <<'PY'
          import hashlib, json, sys
          version = sys.argv[1]
          p = json.load(open(f"scoreboard-{version}.payloads.json"))
          for name in ("boot", "root"):
              f = p[name]["file"]
              assert f == f"scoreboard-{version}.{name}.img.xz", f
              assert hashlib.sha256(open(f, "rb").read()).hexdigest() == p[name]["sha256"], f
              assert p[name]["size"] == len(open(f, "rb").read()), f
          PY

      - name: Verify the tag has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          obj_type="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.type)"
          obj_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)"
          if [ "$obj_type" = tag ]; then
            # An annotated tag object points at the commit; dereference it.
            resolved="$(gh api "repos/$GH_REPO/git/tags/$obj_sha" --jq .object.sha)"
          else
            resolved="$obj_sha"
          fi
          [ "$resolved" = "$GITHUB_SHA" ] || {
            echo "tag $TAG now points at $resolved, not the commit this run built ($GITHUB_SHA)" >&2
            exit 1
          }

      - name: Assume the publisher role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.IMAGE_PUBLISHER_ROLE_ARN }}
          role-session-name: image-publish-${{ github.run_id }}
          aws-region: us-east-1

      # A re-run after the GitHub Release exists must publish the Release's
      # bytes, not sign again. The manifest carries `released` and `expires`,
      # so every signing differs; if a re-run signed afresh and mirrored
      # that, the mirror and the Release would disagree for good (imagecheck
      # compares them twice a day) and each re-run would be a KMS Sign the
      # design's "Sign count equals releases this month" rule cannot
      # explain. So the existing Release is looked for first; when it is
      # there, complete and this build's image, its manifest and signature
      # are downloaded, verified against the repository's public keys and
      # this build's payload facts, and become what the mirror step puts.
      # Only when there is no Release yet is anything signed or created.
      - name: Look for an existing GitHub Release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          file="scoreboard-$VERSION.img.xz"
          assets=("$file" "$file.sha256" "scoreboard-$VERSION.boot.img.xz" "scoreboard-$VERSION.root.img.xz" \
                  "scoreboard-$VERSION.manifest.json" "scoreboard-$VERSION.manifest.sig")
          work="$(mktemp -d "$RUNNER_TEMP/release.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          # gh release view finds a draft too (it falls back from the
          # published-only releases/tags endpoint to a draft lookup), so a
          # half-finished Release from an earlier attempt is seen here
          # rather than mistaken for "not found".
          if gh release view "$TAG" --json isDraft,assets >"$work/release.json" 2>"$work/err"; then
            # Re-running after a later step failed: the Release from the
            # previous attempt is already there. Accept it only if it is
            # published, complete and this build's image; anything else is
            # left for a person to fix or delete, never repaired here.
            refuse() {
              echo "::error::GitHub Release $TAG already exists but $1. Fix or delete the Release by hand, then re-run."
              exit 1
            }
            [ "$(jq -r '.isDraft' "$work/release.json")" = false ] || refuse "is a draft (or its draft state is unreadable)"
            for name in "${assets[@]}"; do
              state="$(jq -r --arg n "$name" '[.assets[] | select(.name == $n)] | if length == 1 then (.[0].state // "unknown") else "missing" end' "$work/release.json")"
              [ "$state" = uploaded ] || refuse "asset $name is $state, not uploaded"
            done
            for name in "$file" "scoreboard-$VERSION.boot.img.xz" "scoreboard-$VERSION.root.img.xz"; do
              local_size="$(stat -c %s "out/$name")"
              remote_size="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .size' "$work/release.json")"
              [ "$remote_size" = "$local_size" ] || refuse "asset $name is $remote_size bytes, not this build's $local_size"
            done
            # GitHub reports a digest for newer assets; older ones have null.
            # Without it, size plus the published .sha256 below must do.
            digest="$(jq -r --arg n "$file" '.assets[] | select(.name == $n) | .digest // ""' "$work/release.json")"
            if [ -n "$digest" ]; then
              [ "$digest" = "sha256:$EXPECTED_SHA256" ] || refuse "asset $file has digest $digest, not this build's sha256:$EXPECTED_SHA256"
            else
              echo "::notice::GitHub reports no digest for $file; relying on its size and published checksum"
            fi
            gh release download "$TAG" --pattern "$file.sha256" --output "$work/existing.sha256" --clobber
            existing_sha="$(cut -d' ' -f1 "$work/existing.sha256")"
            if [ "$existing_sha" != "$EXPECTED_SHA256" ]; then
              refuse "its published checksum ($existing_sha) does not match this build ($EXPECTED_SHA256)"
            fi
            # The Release's manifest and signature are what panels already
            # trust, so they are what the mirror gets. Verified before they
            # are used: the signature against every public key the build
            # artifact carries from the repository (the panel's own rule),
            # and the contents against this build's payload facts, version
            # and channel, so a Release whose manifest describes other
            # bytes is refused rather than mirrored beside these ones.
            gh release download "$TAG" --pattern "scoreboard-$VERSION.manifest.json" \
              --pattern "scoreboard-$VERSION.manifest.sig" --dir "$work" --clobber
            base64 -d "$work/scoreboard-$VERSION.manifest.sig" >"$work/manifest.sig.der"
            key_id=""
            for pem in out/release-signing/*.pem; do
              [ -e "$pem" ] || continue
              if openssl dgst -sha256 -verify "$pem" -signature "$work/manifest.sig.der" \
                   "$work/scoreboard-$VERSION.manifest.json" >/dev/null 2>&1; then
                key_id="$(basename "$pem" .pem)"
              fi
            done
            [ -n "$key_id" ] || refuse "its manifest signature does not verify against any key in device/certs/release-signing/"
            python3 - "$work/scoreboard-$VERSION.manifest.json" "out/scoreboard-$VERSION.payloads.json" \
              "$VERSION" "$CHANNEL" "$key_id" <<'PY' || refuse "its manifest does not describe this build (see above)"
          import json, sys
          manifest, payloads, version, channel, key_id = sys.argv[1:]
          m = json.load(open(manifest))
          p = json.load(open(payloads))
          bad = []
          for field, want in (("version", version), ("channel", channel), ("keyId", key_id), ("layout", p["layout"])):
              if m.get(field) != want:
                  bad.append(f"{field} is {m.get(field)!r}, not {want!r}")
          for name in ("boot", "root"):
              want = {k: p[name][k] for k in ("file", "size", "sha256", "rawSize", "rawSha256")}
              if m.get("payloads", {}).get(name) != want:
                  bad.append(f"the {name} payload differs from this build's")
          for line in bad:
              print(f"existing manifest: {line}", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY
            cp "$work/scoreboard-$VERSION.manifest.json" "$work/scoreboard-$VERSION.manifest.sig" out/
            echo "GitHub Release $TAG already exists, is published and complete, and matches this build; its manifest (signed by $key_id) will be mirrored"
            echo "exists=true" >>"$GITHUB_OUTPUT"
          elif grep -qi 'release not found' "$work/err"; then
            echo "exists=false" >>"$GITHUB_OUTPUT"
          else
            cat "$work/err" >&2
            echo "::error::could not check for an existing GitHub Release $TAG"
            exit 1
          fi

      # A version number is published once. vX.Y.Z (stable) and vX.Y.Z-test
      # (test) are different tags and different Releases, but the mirror
      # keys everything by version, so both would land under images/<v>/,
      # cached as immutable for a year: the second would overwrite the first
      # channel's payloads, manifest and signature in place, every panel on
      # that channel would refuse the manifest (wrong channel) and stop
      # updating, and CloudFront could serve a mix of the two for a year. So
      # when no Release exists yet, a prefix that already holds objects is a
      # refusal, before anything is signed or created. (When the Release
      # exists, the prefix is this run's own earlier attempt.) The role's
      # policy grants ListBucket on images/<v>/ for exactly this.
      - name: Refuse a version number the mirror already holds
        if: steps.existing.outputs.exists == 'false'
        env:
          BUCKET: ${{ vars.IMAGES_BUCKET }}
        run: |
          set -euo pipefail
          count="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "images/$VERSION/" --max-keys 1 \
            --query "length(Contents || \`[]\`)" --output text --region us-east-1)"
          case "$count" in
            0) echo "images/$VERSION/ is free" ;;
            [1-9]*)
              echo "::error::images/$VERSION/ already holds objects on the mirror, but no GitHub Release $TAG exists. Either this version number was published on the other channel (vX.Y.Z and vX.Y.Z-test share the prefix) or its Release was deleted by hand. A number is published once; tag the next one."
              exit 1 ;;
            *)
              echo "::error::unexpected object count for images/$VERSION/: $count"
              exit 1 ;;
          esac

      # The manifest is what a panel trusts. It is signed by the KMS key that
      # only this role may use, only from this approved job, and the private
      # half never exists outside KMS. The signature is checked here against
      # the PUBLIC key the build artifact carries from the repository, so a
      # KMS key and a repository key that disagree fail the release instead
      # of the fleet; a swapped repository key still disagrees with what KMS
      # signed with. The key id in the manifest is the name of the repository
      # file whose public key KMS reports, so a rotation needs no change here.
      # Runs only when the Release is about to be created: one Sign per
      # release, which is what the monthly KMS Sign count is compared to.
      - name: Sign the release manifest
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          cd out
          [ "$CHANNEL" = stable ] || [ "$CHANNEL" = test ] || { echo "unknown channel $CHANNEL" >&2; exit 1; }
          kms_pub="$(aws kms get-public-key --region us-east-1 --key-id alias/scoreboard-release-signing \
            --query PublicKey --output text)"
          printf '%s' "$kms_pub" | base64 -d | openssl pkey -pubin -inform DER -outform PEM >kms-public.pem
          key_id=""
          for pem in release-signing/*.pem; do
            [ -e "$pem" ] || continue
            if cmp -s <(openssl pkey -pubin -in "$pem" -outform DER) <(openssl pkey -pubin -in kms-public.pem -outform DER); then
              key_id="$(basename "$pem" .pem)"
            fi
          done
          [ -n "$key_id" ] || {
            echo "::error::no file under device/certs/release-signing/ carries the public key of alias/scoreboard-release-signing; export it (see device/certs/release-signing/README.md) before releasing, or no panel could verify this release"
            exit 1
          }
          python3 release-manifest.py make --payloads "scoreboard-$VERSION.payloads.json" \
            --version "$VERSION" --channel "$CHANNEL" --key-id "$key_id" >"scoreboard-$VERSION.manifest.json"
          # RAW message type: the manifest is well under KMS's 4 KB limit, and
          # the signature is over its exact bytes so the panel verifies before
          # parsing. KMS returns the DER signature base64-encoded, which is
          # the form published.
          aws kms sign --region us-east-1 --key-id alias/scoreboard-release-signing \
            --signing-algorithm ECDSA_SHA_256 --message-type RAW \
            --message "fileb://scoreboard-$VERSION.manifest.json" \
            --query Signature --output text >"scoreboard-$VERSION.manifest.sig"
          base64 -d "scoreboard-$VERSION.manifest.sig" >manifest.sig.der
          openssl dgst -sha256 -verify "release-signing/$key_id.pem" -signature manifest.sig.der \
            "scoreboard-$VERSION.manifest.json" || {
            echo "::error::KMS's signature does not verify against device/certs/release-signing/$key_id.pem"
            exit 1
          }
          rm manifest.sig.der kms-public.pem
          echo "signed by $key_id for the $CHANNEL channel"
          cat "scoreboard-$VERSION.manifest.json"

      - name: Create the GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          file="scoreboard-$VERSION.img.xz"
          assets=("$file" "$file.sha256" "scoreboard-$VERSION.boot.img.xz" "scoreboard-$VERSION.root.img.xz" \
                  "scoreboard-$VERSION.manifest.json" "scoreboard-$VERSION.manifest.sig")
          work="$(mktemp -d "$RUNNER_TEMP/release.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          # gh release create marks a new Release as GitHub's Latest by
          # default. An older version approved after a newer one must not
          # take that from it (the monitor compares latest.json against
          # GitHub's Latest and would page every run), so read the current
          # Latest first. Only a 404 means there is none yet. A test-channel
          # release is never Latest and is marked a prerelease.
          current_latest=""
          if gh api "repos/$GH_REPO/releases/latest" --jq .tag_name >"$work/latest" 2>"$work/latest.err"; then
            current_latest="$(cat "$work/latest")"
            if [[ ! "$current_latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::GitHub's latest release has an unreadable or malformed tag; refusing to guess whether $VERSION is newer"
              exit 1
            fi
          elif grep -q 'HTTP 404' "$work/latest.err"; then
            current_latest=""
          else
            cat "$work/latest.err" >&2
            echo "::error::could not read GitHub's latest release"
            exit 1
          fi
          make_latest=true
          prerelease=()
          if [ "$CHANNEL" = test ]; then
            make_latest=false
            prerelease=(--prerelease)
          fi
          if [ -n "$current_latest" ]; then
            IFS=. read -r cur_major cur_minor cur_patch <<<"${current_latest#v}"
            IFS=. read -r new_major new_minor new_patch <<<"${VERSION#v}"
            if [ "$cur_major" -gt "$new_major" ] || \
               { [ "$cur_major" -eq "$new_major" ] && [ "$cur_minor" -gt "$new_minor" ]; } || \
               { [ "$cur_major" -eq "$new_major" ] && [ "$cur_minor" -eq "$new_minor" ] && [ "$cur_patch" -gt "$new_patch" ]; }; then
              make_latest=false
              echo "::notice::GitHub's Latest is $current_latest, newer than $VERSION; publishing $VERSION without marking it Latest"
            fi
          fi
          files=()
          for name in "${assets[@]}"; do files+=("out/$name"); done
          gh release create "$TAG" \
            "${files[@]}" \
            --verify-tag \
            --latest="$make_latest" "${prerelease[@]}" \
            --title "Scoreboard image $VERSION ($CHANNEL)" \
            --notes "Verify before you flash: https://scoreboard.davidjdrake.com/download/ -- Panels flashed before the six-partition layout cannot update to this release; they need one reflash."

      - name: Mirror to the image CDN
        env:
          BUCKET: ${{ vars.IMAGES_BUCKET }}
          DISTRIBUTION: ${{ vars.IMAGES_DISTRIBUTION_ID }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          file="scoreboard-$VERSION.img.xz"
          sha="$(cut -d' ' -f1 "out/$file.sha256")"
          size="$(stat -c %s "out/$file")"
          # The manifest and signature in out/ are either what was just
          # signed and put on the new Release, or the existing Release's own
          # bytes (fetched and verified above), so the mirror and the
          # Release agree either way.
          put() {
            aws s3 cp "out/$1" "s3://$BUCKET/images/$VERSION/$1" --region us-east-1 \
              --checksum-algorithm SHA256 --content-type "$2" \
              --cache-control "public, max-age=31536000, immutable"
          }
          put "$file" application/x-xz
          put "$file.sha256" text/plain
          put "scoreboard-$VERSION.boot.img.xz" application/x-xz
          put "scoreboard-$VERSION.root.img.xz" application/x-xz
          put "scoreboard-$VERSION.manifest.json" application/json
          put "scoreboard-$VERSION.manifest.sig" text/plain

          # The channel's pointer: latest.json for stable, latest-<channel>.json
          # otherwise. A test release never touches latest.json.
          case "$CHANNEL" in
            stable) pointer=latest.json ;;
            *) pointer="latest-$CHANNEL.json" ;;
          esac

          # The concurrency group above only stops two publish runs from
          # interleaving their writes; it does not order which version
          # wins. An older release approved after a newer one has already
          # published must not roll the pointer backwards, so look up
          # whatever is there now and compare versions numerically before
          # ever overwriting it. A plain GetObject/HeadObject can't tell a
          # missing key from one denied by a scoped policy without
          # s3:ListBucket (both come back as 403, not 404), so look the
          # object up with a ListObjectsV2 scoped to this one key instead:
          # 0 means no release has published yet, 1 means it has and gets
          # read, anything else (or any error from either call) fails the
          # job rather than publishing blind. The rule is kept per pointer
          # file, so the test channel's history never gates the stable one.
          count="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$pointer" --max-keys 1 \
            --query "length(Contents[?Key=='$pointer'] || \`[]\`)" --output text --region us-east-1)"
          current_version=""
          case "$count" in
            0)
              ;;
            1)
              current_json="$(aws s3 cp "s3://$BUCKET/$pointer" - --region us-east-1)"
              current_version="$(printf '%s' "$current_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))')"
              if [[ ! "$current_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "existing $pointer has an unreadable or malformed version; refusing to publish blind" >&2
                exit 1
              fi
              ;;
            *)
              echo "unexpected object count for $pointer: $count" >&2
              exit 1
              ;;
          esac

          should_write=yes
          if [ -n "$current_version" ]; then
            IFS=. read -r cur_major cur_minor cur_patch <<<"${current_version#v}"
            IFS=. read -r new_major new_minor new_patch <<<"${VERSION#v}"
            if [ "$cur_major" -gt "$new_major" ] || \
               { [ "$cur_major" -eq "$new_major" ] && [ "$cur_minor" -gt "$new_minor" ]; } || \
               { [ "$cur_major" -eq "$new_major" ] && [ "$cur_minor" -eq "$new_minor" ] && [ "$cur_patch" -gt "$new_patch" ]; }; then
              should_write=no
            fi
          fi

          if [ "$should_write" = yes ]; then
            python3 - "$VERSION" "$file" "$sha" "$size" "$RELEASE_URL" "$CHANNEL" >"$pointer" <<'PY'
          import datetime, json, sys
          version, file, sha, size, release, channel = sys.argv[1:]
          released = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          print(json.dumps({"version": version, "channel": channel, "file": file, "sha256": sha, "size": int(size),
                            "released": released, "release": release,
                            "manifest": f"images/{version}/scoreboard-{version}.manifest.json"}, indent=2))
          PY
            aws s3 cp "$pointer" "s3://$BUCKET/$pointer" --region us-east-1 \
              --content-type application/json --cache-control "public, max-age=60"
            aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/$pointer"
          else
            echo "::notice::$pointer already points at $current_version, newer than $VERSION; leaving it in place ($file and the GitHub Release still published)"
          fi
