# Installed by tools/pi-setup.sh --appliance to
# /etc/systemd/system/NetworkManager.service.d/. Orders NetworkManager after
# the two bind mounts it reads from STATE.
#
# Both binds are `nofail` in the fstab, and systemd.mount(5) says a nofail
# mount "is not ordered before" local-fs.target; so nothing in the default
# dependencies makes NetworkManager wait for them. On a boot where STATE's
# fsck is slow, NetworkManager would start against the empty directories on
# the read-only root, find no profile (its keyfile plugin reads
# system-connections once and does not re-scan when a mount lands on top),
# and the panel would sit unjoined until the next boot. After= alone waits
# for the mount jobs to finish -- succeed, fail, or time out at the fstab's
# 10 s -- and nothing more: not RequiresMountsFor=, which would refuse to
# start NetworkManager at all on a torn STATE, when the design (4.3) wants
# that panel to boot to its help screen and be looked at.
#
# The names are systemd's escaping of the mount points
# (systemd-escape -p /etc/NetworkManager/system-connections).
[Unit]
After=etc-NetworkManager-system\x2dconnections.mount var-lib-NetworkManager.mount
