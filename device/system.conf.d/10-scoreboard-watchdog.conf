# Installed by tools/pi-setup.sh --appliance to /etc/systemd/system.conf.d/.
#
# The hardware watchdog, petted by systemd (PID 1). A trial boot of a new
# release that hangs would otherwise wait for a person to pull the plug;
# with this, a system in which PID 1 stops running is reset by the SoC, the
# one-shot tryboot flag is already clear, so the reset boots the old slot,
# and /proc/device-tree/chosen/bootloader/rsts on that boot says a watchdog
# did it (design 5.2). It is also the answer to H9's unexplained stop: a hang
# now reboots by itself and the journal says why.
#
# The SoC's bcm2835_wdt can count to only about 16 s (max_hw_heartbeat_ms:
# 0xfffff ticks at 65,536 Hz). 60 s is valid only because the kernel's
# watchdog core re-pings the hardware itself underneath a longer software
# timeout. An older driver that declared max_timeout 15 would REJECT 60 and
# leave the watchdog silently unarmed, so H16 in docs/hardware-checks.md reads
# the journal line in which systemd reports the watchdog set to 1min, and the
# kernel it was verified on is recorded here:
#
#   verified on: (pending H16; expected 6.12.y, the kernel trixie ships)
[Manager]
RuntimeWatchdogSec=60
