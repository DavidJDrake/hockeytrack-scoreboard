# Slot B is MBR partitions 3 (boot) and 6 (root) as tools/image-layout.sh
# builds the card: the roots are logical partitions inside the extended
# container at 4, so they are 5 and 6, not design 4.1's 4 and 5. These two
# lines are the only difference between the @a and @b instances, and they
# are what makes the write unit unable to touch the running slot.
[Service]
DeviceAllow=/dev/mmcblk0p3 rw
DeviceAllow=/dev/mmcblk0p6 rw
